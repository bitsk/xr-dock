[package]
name = "xr-dock"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Independent UKUI XR application and task dock"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xr-shell-protocols = { version = "=0.2.0", path = "../xr-shell/protocols" }
xr-spatial-kit = { version = "=0.1.0", path = "../xr-spatial-kit" }

[profile.release]
lto = "thin"
